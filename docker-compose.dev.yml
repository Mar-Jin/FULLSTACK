services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "RevaliNowPassword1!"
      ACCEPT_EULA: "Y"
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/1433" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mssqldata:/var/opt/mssql

  web:
    build:
      context: ./Server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Nederlandse tijd, zodat 'nu' (bijv. bij een pijnregistratie) klopt met de tijden in de dataset
      - TZ=Europe/Amsterdam
      - ConnectionStrings__DefaultConnection=Server=db;Database=RevaliNow;User=sa;Password=RevaliNowPassword1!;TrustServerCertificate=True;Encrypt=False
      # Alleen voor lokale ontwikkeling; gebruik in productie een eigen, geheime sleutel
      - Jwt__Key=dev-only-sleutel-voor-revalinow-niet-gebruiken-in-productie
      - Seed__PatientWachtwoord=Welkom123!
    # Do not publish backend directly; proxy will route /api to this service
  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    depends_on:
      - web
    # Do not publish frontend directly; proxy will serve the frontend on host port 80
    restart: unless-stopped
  proxy:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      client:
        condition: service_started
    restart: unless-stopped
volumes:
  mssqldata: